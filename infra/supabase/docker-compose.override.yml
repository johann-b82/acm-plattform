# Overrides für den gepinnten Supabase-Upstream (infra/supabase/upstream).
# Wird zusammen mit upstream/docker-compose.yml über `include:` im Root-Compose
# geladen; relative Pfade lösen gegen upstream/ auf.
#
# Abweichungen (siehe infra/supabase/README.md):
#   - jeder Dienst mit Log-Rotation (docs/logging.md)
#   - keine Host-Ports außer 127.0.0.1 (Kong für Studio-Zugriff per Tunnel,
#     Postgres für lokale Werkzeuge); der Plattform-Caddy routet /supabase/*
#   - Edge-Functions und Supavisor werden nicht betrieben (Profil "unused")
#   - GoTrue ruft den Custom Access Token Hook (Claim `apps`) auf
#   - die Dateien des Speichers liegen in einem benannten Volume
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  studio:
    logging: *default-logging

  kong:
    logging: *default-logging
    ports: !override
      - "127.0.0.1:${KONG_HTTP_PORT}:8000/tcp"

  auth:
    logging: *default-logging
    environment:
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_ENABLED: "true"
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_URI: "pg-functions://postgres/public/custom_access_token_hook"

  rest:
    logging: *default-logging

  realtime:
    logging: *default-logging

  storage:
    logging: *default-logging
    volumes: !override
      - speicher:/var/lib/storage

  imgproxy:
    logging: *default-logging
    volumes: !override
      - speicher:/var/lib/storage

  meta:
    logging: *default-logging

  db:
    logging: *default-logging
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT}:5432"

  functions:
    logging: *default-logging
    profiles: ["unused"]

  supavisor:
    logging: *default-logging
    profiles: ["unused"]

# Der Upstream haengt die Dateien des Speichers als Bind-Mount in
# `upstream/volumes/storage`. Das ist aus zwei Gruenden der falsche Ort.
#
# Erstens gehoert das Verzeichnis `fetch-upstream.sh`: es ist nicht
# eingecheckt und wird beim naechsten Holen neu angelegt. Hochgeladene Dateien
# lagen damit in einem Verzeichnis, das ein Werkzeug jederzeit wegraeumen darf.
#
# Zweitens legt der Speicher-Dienst die Metadaten eines Objekts als erweiterte
# Attribute an der Datei ab. Ein Bind-Mount vom Mac kann das nicht, und der
# Upload scheitert mit `ENOTSUP`. Ein benanntes Volume liegt im Dateisystem
# der Docker-VM und kann es.
volumes:
  speicher:
