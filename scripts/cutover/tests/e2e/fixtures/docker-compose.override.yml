# Nachbau der Datei, die am Produktionshost neben docker-compose.yml liegt
# und nicht im Repo steht. Dort: 192.9.200.1/.2 (Firmen-DNS). Im Test
# öffentliche Resolver, damit der api-Container Namen auflösen kann.
services:
  api:
    dns:
      - 1.1.1.1
      - 9.9.9.9
  # Am Host gemessen (docs/cutover.md § 1): Postgres nur auf 127.0.0.1:5432.
  # Woher die Bindung dort stammt, ist nicht gesehen; hier liegt sie im Override.
  db:
    ports:
      - "127.0.0.1:5432:5432"
