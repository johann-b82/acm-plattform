[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apollo-sync"
version = "0.1.0"
description = "Apollo (CONZEPT 16) nativ lesen — ohne Windows-ODBC-Treiber; Feeds für die ACM-Plattform"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# nur für den Plattform-Dienst bzw. den Lieferschein-Feed (.xlsx)
service = ["requests>=2.31", "openpyxl>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
apollo-sync = "apollo_sync.cli:main"

[tool.setuptools]
packages = ["apollo_sync"]

[tool.setuptools.package-data]
apollo_sync = ["wire_schema.json", "table_policy.json"]
