name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guards:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Supabase-Upstream holen (gepinnt)
        run: bash infra/supabase/fetch-upstream.sh "$(cat infra/supabase/UPSTREAM_TAG)"
      - name: Log-Hygiene
        run: bash scripts/ci/check_log_hygiene.sh
      - name: service_role-Guard (Quellcode)
        run: bash scripts/ci/check_service_role.sh
      - name: Player-Weg in Caddy (Origin und Reihenfolge)
        run: bash scripts/ci/check_caddy_signage.sh
      - name: Caddyfile gültig
        run: |
          docker run --rm -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Apps vollständig (Kachel und Rechtestufe)
        run: bash scripts/ci/check_apps_vollstaendig.sh
      - name: Stichtag-Skript (Unit-Tests)
        run: bash scripts/cutover/tests/unit.sh
      - name: Compose-Modell validieren
        run: |
          cp .env.example .env
          sh infra/supabase/upstream/utils/generate-keys.sh --update-env >/dev/null
          docker compose config --quiet

  compute:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tests (Migrationen, RLS und KPI-Funktionen gegen Wegwerf-Postgres)
        run: docker compose -f docker-compose.test.yml run --rm --build compute-test

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: service_role-Guard (Bundle)
        working-directory: .
        run: bash scripts/ci/check_service_role.sh
